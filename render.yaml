services:
  - type: web
    name: staynest-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: staynest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_ENGINE
        value: sqlite
      - key: SQLITE_DB_PATH
        value: /var/data/staynest.db
      - key: JWT_SECRET
        generateValue: true
